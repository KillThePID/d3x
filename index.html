<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d3x | Keep It Simple</title>
    <!-- Site Icons -->
    <link rel="icon" href="Images/SiteIcon.ico" type="image/x-icon">
    <link rel="icon" href="Images/SiteIcon.png" type="image/png">
    <link rel="icon" href="Images/SiteIcon.svg" type="image/svg+xml">

    <!-- Fonts & Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Optimized Cache Control for GitHub Pages -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
    <meta http-equiv="Expires" content="Thu, 31 Dec 2026 23:59:59 GMT">
    <meta http-equiv="Last-Modified" content="Sat, 29 Mar 2025 00:00:00 GMT">
    <meta http-equiv="ETag" content="v1.0.0">

    <style>
        /* Cyberpunk Theme Colors */
        :root {
            --primary-bg: #0a0f1e;
            --secondary-bg: #141d2f;
            --text-color: #c3d8ff;
            --neon-blue: #00bfff;
            --neon-purple: #a64dff;
            --glow: rgba(0, 191, 255, 0.7);
            --dark-grey: #2a2a2a;
        }

        /* Global Styles */
        body {
            background: var(--primary-bg);
            color: var(--text-color);
            font-family: 'Courier', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px 20px;
            box-sizing: border-box;
            position: relative;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Source Code Button */
        .source-code {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 6px;
            background: var(--dark-grey);
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.8em;
            text-align: center;
            border-radius: 5px;
            transition: transform 0.3s;
            border: none;
        }
        .source-code:hover {
            transform: translateY(-2px);
            background: var(--neon-blue);
            color: #000;
        }

        /* Avatar */
        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            background: url('Images/Avatar.jpg') no-repeat center center/cover;
            box-shadow: 0 0 15px var(--neon-blue);
            margin-bottom: 15px;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Name & Title */
        .name {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--neon-purple);
            margin-bottom: 2px;
        }
        .title {
            font-size: 0.8em;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 8px;
        }

        /* Bio */
        .bio {
            font-size: 1em;
            color: var(--text-color);
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Links */
        .link {
            display: block;
            width: 80%;
            max-width: 600px;
            padding: 15px;
            margin: 5px 0;
            background: var(--secondary-bg);
            color: var(--text-color);
            text-decoration: none;
            font-size: 1em;
            text-align: center;
            border-radius: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 10px var(--glow);
            border: 1px solid var(--neon-blue);
        }
        .link:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px var(--neon-blue);
            background: var(--neon-blue);
            color: #000;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .social-icons a {
            margin: 0 10px;
            color: var(--text-color);
            font-size: 1.5em;
            transition: color 0.3s, transform 0.3s;
        }
        .social-icons a:hover {
            color: var(--neon-purple);
            transform: scale(1.1);
        }
    </style>

    <!-- Enhanced protection scripts -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('dragstart', function(e) {
            if (e.target.classList.contains('avatar')) {
                e.preventDefault();
            }
        });
        
        document.addEventListener('copy', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
            }
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
            }
        });
    </script>
</head>
<body>
    <a href="https://github.com/KillThePID/d3x" class="source-code">Source Code</a>
    <div class="avatar"></div>
    <div class="name">Hi, I'm Dexter!</div>
    <div class="title">Just Some Random Guy On The Internet</div>
    <div class="bio">I care about privacy, FOSS, and self-sovereignty. Feel free to reach out—I'm always eager to chat.</div>

        <a href="https://github.com/KillThePID"><i class="fab fa-github"></i></a>
    </div>
</body>
</html>
